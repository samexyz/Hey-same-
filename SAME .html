<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SAME — Keyless</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000; color: #fff; min-height: 100vh;
    padding-bottom: 20px; overflow-x: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #00d9ff;
    box-shadow: 0 2px 15px rgba(0, 217, 255, 0.2);
  }
  .header h1 {
    font-size: 22px; color: #00d9ff; letter-spacing: 3px;
    font-weight: 800; text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
  }
  .badge {
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
    font-weight: 700; background: #333; color: #888; border: 1px solid #444;
    transition: all 0.3s;
  }
  .badge.connected {
    background: rgba(0, 255, 100, 0.15); color: #00ff64;
    border-color: #00ff64; box-shadow: 0 0 12px rgba(0, 255, 100, 0.4);
  }
  .badge.connecting {
    background: rgba(255, 200, 0, 0.15); color: #ffc800;
    border-color: #ffc800; animation: pulse 1s infinite;
  }
  .badge.scanning {
    background: rgba(0, 217, 255, 0.15); color: #00d9ff;
    border-color: #00d9ff; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .status-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
    background: #222; margin: 12px 15px; border-radius: 12px;
    overflow: hidden; border: 1px solid #333;
  }
  .stat { background: #1a1a1a; padding: 11px 6px; text-align: center; }
  .stat-label {
    font-size: 10px; color: #666; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 3px; font-weight: 600;
  }
  .stat-value { font-size: 14px; font-weight: 700; color: #fff; }
  .stat-value.on { color: #00ff64; }
  .stat-value.off { color: #ff4444; }
  .stat-value.rssi { color: #00d9ff; }

  .btn-grid { padding: 0 15px; display: grid; gap: 12px; }

  .btn {
    padding: 22px 20px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800; letter-spacing: 1px;
    color: #fff; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

  .btn-igon  { background: linear-gradient(135deg, #00c853, #008c3a); box-shadow: 0 4px 20px rgba(0,200,83,0.4); }
  .btn-igoff { background: linear-gradient(135deg, #ff9800, #cc7a00); box-shadow: 0 4px 20px rgba(255,152,0,0.4); }
  .btn-mlock { background: linear-gradient(135deg, #e53935, #b71c1c); box-shadow: 0 4px 20px rgba(229,57,53,0.4); }
  .btn-boot  { background: linear-gradient(135deg, #2979ff, #0d47a1); box-shadow: 0 4px 20px rgba(41,121,255,0.4); }
  .btn-find  { background: linear-gradient(135deg, #9c27b0, #4a148c); box-shadow: 0 4px 20px rgba(156,39,176,0.4); }
  .btn-pair  { background: linear-gradient(135deg, #00d9ff, #0088aa); color: #000; box-shadow: 0 4px 20px rgba(0,217,255,0.5); }

  .find-status {
    margin: 12px 15px; padding: 16px; border-radius: 12px;
    text-align: center; font-size: 16px; font-weight: 700;
    background: #1a1a1a; color: #888; border: 2px solid #333;
    transition: all 0.3s; min-height: 55px;
    display: flex; align-items: center; justify-content: center;
  }
  .find-status.green  { background: rgba(0,200,83,0.15);  color: #00ff64; border-color: #00ff64; box-shadow: 0 0 20px rgba(0,255,100,0.3); }
  .find-status.yellow { background: rgba(255,200,0,0.15); color: #ffc800; border-color: #ffc800; }
  .find-status.orange { background: rgba(255,100,0,0.15); color: #ff6400; border-color: #ff6400; }
  .find-status.red    { background: rgba(255,50,50,0.15); color: #ff3232; border-color: #ff3232; }
  .find-status.blue   { background: rgba(0,217,255,0.15); color: #00d9ff; border-color: #00d9ff; animation: pulse 1s infinite; }

  .toolbar {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin: 15px; padding: 12px; background: #111;
    border-radius: 12px; border: 1px solid #222;
  }
  .tool-btn {
    padding: 14px 6px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; background: #2a2a2a;
    color: #ccc; cursor: pointer; transition: all 0.15s;
  }
  .tool-btn:active { background: #3a3a3a; transform: scale(0.95); }
  .tool-btn:disabled { opacity: 0.3; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: #1a1a1a; border-radius: 16px; padding: 22px;
    width: 100%; max-width: 380px; border: 2px solid #333;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }
  .modal h2 { font-size: 19px; margin-bottom: 6px; color: #00d9ff; }
  .modal p { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.5; }
  .modal input {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 2px solid #333; background: #0a0a0a; color: #fff;
    font-size: 15px; margin-bottom: 14px; outline: none;
    transition: border 0.2s;
  }
  .modal input:focus { border-color: #00d9ff; }
  .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-btn {
    padding: 13px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn.primary { background: #00d9ff; color: #000; }
  .modal-btn.secondary { background: #333; color: #fff; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); background: #00d9ff; color: #000;
    padding: 12px 22px; border-radius: 30px; font-size: 14px;
    font-weight: 700; box-shadow: 0 4px 20px rgba(0,217,255,0.5);
    opacity: 0; transition: opacity 0.3s, bottom 0.3s;
    z-index: 200; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; bottom: 40px; }

  .footer {
    text-align: center; margin-top: 18px;
    font-size: 11px; color: #444; padding: 0 15px;
  }
  .footer span { color: #00d9ff; }

  .loader {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%; border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>SAME</h1>
  <div class="badge" id="statusBadge">SCANNING...</div>
</div>

<div class="status-row">
  <div class="stat">
    <div class="stat-label">Side Stand</div>
    <div class="stat-value" id="valStand">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">RSSI</div>
    <div class="stat-value rssi" id="valRssi">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Ignition</div>
    <div class="stat-value" id="valIgn">—</div>
  </div>
</div>

<div class="btn-grid">
  <button class="btn btn-pair hidden" id="btnPair">🔗 PAIR WITH SCOOTER (First Time Only)</button>
  <button class="btn btn-igon" id="btnIgON" disabled>⚡ IGNITION ON</button>
  <button class="btn btn-igoff" id="btnIgOFF" disabled>🔓 IGNITION OFF</button>
  <button class="btn btn-mlock" id="btnMLock" disabled>🔒 MOTOR LOCK</button>
  <button class="btn btn-boot" id="btnBoot" disabled>🚪 BOOT SPACE</button>
  <button class="btn btn-find" id="btnFind" disabled>🔍 FIND MY SCOOTER</button>
</div>

<div class="find-status" id="findStatus">Waiting for connection...</div>

<div class="toolbar">
  <button class="tool-btn" id="btnDebug" disabled>🔧 Debug</button>
  <button class="tool-btn" id="btnOTA" disabled>📡 OTA</button>
  <button class="tool-btn" id="btnLoc" disabled>📍 Location</button>
</div>

<div class="footer">
  System: <span>SAME</span> • Auto-Connect v2.0<br>
  <span id="footerHint">Looking for paired scooter...</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Password Required</h2>
    <p id="modalDesc">Enter password to continue</p>
    <input type="password" id="modalInput" placeholder="Enter password" autocomplete="off">
    <div class="modal-buttons">
      <button class="modal-btn secondary" id="modalCancel">Cancel</button>
      <button class="modal-btn primary" id="modalSubmit">Submit</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   SAME Keyless Entry — Auto-Connect Web Bluetooth Client
   Auto-connects to previously-paired device
   ===================================================================== */

const CONFIG = {
  DEVICE_NAME: 'SAME',
  SERVICE_UUID: '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
  CHAR_UUID: '6e400002-b5a3-f393-e0a9-e50e24dcca9e',
  MAGIC_TOKEN: 'Kx7Pm3Rq9Tn5Vw2Zy8Bs4Ld6Fh1Jc0GeMv4Ru7Ap2Ni5Sk8',
  AUTH_PASSWORD: 'sameer@256',
  STATUS_INTERVAL_MS: 1000,
  FIND_DURATION_MS: 10000,       // 10 seconds MLOCK repeat
  FIND_MLOCK_INTERVAL_MS: 1000,  // Every 1 second
  RECONNECT_RETRY_MS: 3000
};

const state = {
  device: null,
  server: null,
  service: null,
  characteristic: null,
  isConnected: false,
  isAuthenticated: false,
  pendingAction: null,
  lastLat: null,
  lastLon: null,
  statusTimer: null,
  findTimer: null,
  findRepeatTimer: null,
  reconnectTimer: null,
  gattEventBound: false
};

const $ = (id) => document.getElementById(id);
const el = {
  statusBadge: $('statusBadge'),
  valStand: $('valStand'),
  valRssi: $('valRssi'),
  valIgn: $('valIgn'),
  btnPair: $('btnPair'),
  btnIgON: $('btnIgON'),
  btnIgOFF: $('btnIgOFF'),
  btnMLock: $('btnMLock'),
  btnBoot: $('btnBoot'),
  btnFind: $('btnFind'),
  findStatus: $('findStatus'),
  btnDebug: $('btnDebug'),
  btnOTA: $('btnOTA'),
  btnLoc: $('btnLoc'),
  modalOverlay: $('modalOverlay'),
  modalTitle: $('modalTitle'),
  modalDesc: $('modalDesc'),
  modalInput: $('modalInput'),
  modalCancel: $('modalCancel'),
  modalSubmit: $('modalSubmit'),
  toast: $('toast'),
  footerHint: $('footerHint')
};

let toastTimer;
function showToast(msg, ms = 2000) {
  clearTimeout(toastTimer);
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), ms);
}

function setBadge(text, cls) {
  el.statusBadge.textContent = text;
  el.statusBadge.className = 'badge' + (cls ? ' ' + cls : '');
}

function setConnectedUI(connected) {
  if (connected) {
    setBadge('CONNECTED', 'connected');
    el.btnPair.classList.add('hidden');
    el.btnIgON.disabled = false;
    el.btnIgOFF.disabled = false;
    el.btnMLock.disabled = false;
    el.btnBoot.disabled = false;
    el.btnFind.disabled = false;
    el.btnDebug.disabled = false;
    el.btnOTA.disabled = false;
    el.btnLoc.disabled = false;
    el.footerHint.textContent = 'Connected ✔';
  } else {
    setBadge('OFFLINE', '');
    el.btnIgON.disabled = true;
    el.btnIgOFF.disabled = true;
    el.btnMLock.disabled = true;
    el.btnBoot.disabled = true;
    el.btnFind.disabled = true;
    el.btnDebug.disabled = true;
    el.btnOTA.disabled = true;
    el.btnLoc.disabled = true;
    el.valStand.textContent = '—';
    el.valStand.className = 'stat-value';
    el.valRssi.textContent = '—';
    el.valRssi.className = 'stat-value rssi';
    el.valIgn.textContent = '—';
    el.valIgn.className = 'stat-value';
  }
}

async function sendCommand(text) {
  if (!state.characteristic) return false;
  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    if (state.characteristic.properties.writeWithoutResponse) {
      await state.characteristic.writeValueWithoutResponse(data);
    } else {
      await state.characteristic.writeValue(data);
    }
    console.log('[BLE] Sent:', text);
    return true;
  } catch (err) {
    console.error('[BLE] Send failed:', err);
    return false;
  }
}

function handleStatusMessage(msg) {
  const parts = msg.split('|');
  if (parts.length < 5) return;
  const stand = parts[2] === '1';
  const rssi = parseInt(parts[3], 10);
  const ig = parts[4] === '1';

  el.valStand.textContent = stand ? 'ON' : 'OFF';
  el.valStand.className = 'stat-value ' + (stand ? 'on' : 'off');

  el.valRssi.textContent = rssi === -100 ? '—' : rssi + ' dBm';

  el.valIgn.textContent = ig ? 'ON' : 'OFF';
  el.valIgn.className = 'stat-value ' + (ig ? 'on' : 'off');

  if (state.pendingAction === 'FIND') {
    updateFindStatus(rssi);
  }
}

function updateFindStatus(rssi) {
  if (rssi === -100) {
    el.findStatus.textContent = '❌ Not in range';
    el.findStatus.className = 'find-status red';
    return;
  }
  if (rssi >= -50) {
    el.findStatus.textContent = '🟢 VERY CLOSE — ' + rssi + ' dBm';
    el.findStatus.className = 'find-status green';
  } else if (rssi >= -70) {
    el.findStatus.textContent = '🟡 CLOSE — ' + rssi + ' dBm';
    el.findStatus.className = 'find-status yellow';
  } else if (rssi >= -85) {
    el.findStatus.textContent = '🟠 FAR — ' + rssi + ' dBm';
    el.findStatus.className = 'find-status orange';
  } else {
    el.findStatus.textContent = '🔴 VERY FAR — ' + rssi + ' dBm';
    el.findStatus.className = 'find-status red';
  }
}

function handleIncomingData(event) {
  try {
    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(event.target.value).trim();
    console.log('[BLE] Recv:', text);

    if (text === 'APP_OK') {
      state.isAuthenticated = true;
      showToast('✔ Authenticated');
      el.findStatus.textContent = 'Ready';
      return;
    }
    if (text === 'PING') {
      sendCommand('PONG');
      return;
    }
    if (text.startsWith('STATUS|')) {
      handleStatusMessage(text);
      return;
    }
  } catch (e) { console.error(e); }
}

// ---- GATT connect core ----
async function connectToDevice(device) {
  try {
    state.device = device;
    setBadge('CONNECTING', 'connecting');

    state.device.addEventListener('gattserverdisconnected', onDisconnected);

    state.server = await device.gatt.connect();
    state.service = await state.server.getPrimaryService(CONFIG.SERVICE_UUID);
    state.characteristic = await state.service.getCharacteristic(CONFIG.CHAR_UUID);

    await state.characteristic.startNotifications();
    state.characteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

    state.isConnected = true;
    state.isAuthenticated = false;
    setConnectedUI(true);
    showToast('✔ Connected to SAME');

    await new Promise(r => setTimeout(r, 200));
    await sendCommand(CONFIG.MAGIC_TOKEN);

    requestLocation();
    startStatusTimer();
    el.findStatus.textContent = 'Ready';
    el.findStatus.className = 'find-status';
  } catch (err) {
    console.error('[BLE] Connect failed:', err);
    setConnectedUI(false);
    showToast('Connect failed');
    scheduleReconnect();
  }
}

// ---- AUTO-CONNECT: get previously permitted devices ----
async function autoConnect() {
  if (!navigator.bluetooth) {
    setBadge('NOT SUPPORTED', '');
    el.footerHint.textContent = 'Web Bluetooth not supported';
    return;
  }

  setBadge('SCANNING', 'scanning');
  el.footerHint.textContent = 'Looking for paired device...';

  try {
    // Chrome 85+: getDevices() returns previously permitted devices
    if (navigator.bluetooth.getDevices) {
      const devices = await navigator.bluetooth.getDevices();
      console.log('[BLE] Previously paired devices:', devices.length);
      const sameDevice = devices.find(d => d.name === CONFIG.DEVICE_NAME);
      if (sameDevice) {
        console.log('[BLE] Found paired SAME — auto connecting');
        await connectToDevice(sameDevice);
        return;
      }
    }

    // No paired device found
    console.log('[BLE] No paired device found');
    setBadge('NOT PAIRED', '');
    el.btnPair.classList.remove('hidden');
    el.footerHint.textContent = 'First time — press Pair button';
  } catch (err) {
    console.error('[BLE] autoConnect error:', err);
    setBadge('NOT PAIRED', '');
    el.btnPair.classList.remove('hidden');
    el.footerHint.textContent = 'Press Pair button';
  }
}

// ---- First-time pair ----
async function pairFirstTime() {
  try {
    setBadge('PAIRING...', 'connecting');
    el.btnPair.disabled = true;

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: CONFIG.DEVICE_NAME }],
      optionalServices: [CONFIG.SERVICE_UUID]
    });

    await connectToDevice(device);
    el.btnPair.classList.add('hidden');
  } catch (err) {
    console.error('[BLE] Pair failed:', err);
    if (err.name === 'NotFoundError') {
      showToast('Device not found — power on ESP32');
    } else {
      showToast('Pair failed');
    }
    setBadge('NOT PAIRED', '');
  } finally {
    el.btnPair.disabled = false;
  }
}

// ---- Disconnect ----
function onDisconnected() {
  console.log('[BLE] Disconnected');
  state.isConnected = false;
  state.isAuthenticated = false;
  stopStatusTimer();
  stopFindTimers();
  saveLastLocation();
  setConnectedUI(false);
  showToast('Disconnected');
  scheduleReconnect();
}

function scheduleReconnect() {
  if (state.reconnectTimer) return;
  state.reconnectTimer = setTimeout(() => {
    state.reconnectTimer = null;
    if (!state.isConnected) autoConnect();
  }, CONFIG.RECONNECT_RETRY_MS);
}

// ---- Timers ----
function startStatusTimer() {
  stopStatusTimer();
  state.statusTimer = setInterval(() => {
    if (state.isConnected && state.isAuthenticated) sendCommand('STATUS');
  }, CONFIG.STATUS_INTERVAL_MS);
}
function stopStatusTimer() {
  if (state.statusTimer) { clearInterval(state.statusTimer); state.statusTimer = null; }
}

function stopFindTimers() {
  if (state.findTimer) { clearTimeout(state.findTimer); state.findTimer = null; }
  if (state.findRepeatTimer) { clearInterval(state.findRepeatTimer); state.findRepeatTimer = null; }
}

// ---- Location ----
function requestLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lastLat = pos.coords.latitude;
      state.lastLon = pos.coords.longitude;
    },
    (err) => console.warn('[GPS]', err.message),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function saveLastLocation() {
  if (state.lastLat != null && state.lastLon != null) {
    try {
      localStorage.setItem('SAME_last_location', state.lastLat + ',' + state.lastLon);
      localStorage.setItem('SAME_last_time', new Date().toISOString());
    } catch (e) {}
  }
}

function showSavedLocation() {
  const loc = localStorage.getItem('SAME_last_location');
  const time = localStorage.getItem('SAME_last_time');
  if (!loc) { showToast('No location saved yet'); return; }
  const [lat, lon] = loc.split(',');
  const when = time ? new Date(time).toLocaleString() : 'Unknown';
  if (confirm('Last seen:\n\nLat: ' + lat + '\nLon: ' + lon + '\nWhen: ' + when + '\n\nOpen in Maps?')) {
    window.open('https://www.google.com/maps?q=' + lat + ',' + lon, '_blank');
  }
}

// ---- Password Modal ----
function showPasswordModal(action) {
  state.pendingAction = action;
  if (action === 'DEBUG') {
    el.modalTitle.textContent = '🔧 Debug Mode';
    el.modalDesc.textContent = 'Enter password';
  } else if (action === 'OTA') {
    el.modalTitle.textContent = '📡 OTA Update';
    el.modalDesc.textContent = 'Enter password';
  }
  el.modalInput.value = '';
  el.modalOverlay.classList.add('show');
  setTimeout(() => el.modalInput.focus(), 100);
}
function hidePasswordModal() {
  el.modalOverlay.classList.remove('show');
  el.modalInput.value = '';
  if (state.pendingAction !== 'FIND') state.pendingAction = null;
}
async function submitPassword() {
  const pass = el.modalInput.value;
  const action = state.pendingAction;
  hidePasswordModal();
  if (pass !== CONFIG.AUTH_PASSWORD) { showToast('❌ Wrong password'); return; }
  if (action === 'DEBUG') {
    await sendCommand('DEBUG:' + pass);
    showToast('✔ Debug mode');
    setTimeout(() => alert('Debug Mode\n\n1. WiFi → ESP32_DEBUG\n2. Password: sameer@256\n3. Telnet app → 192.168.4.1:23'), 300);
  } else if (action === 'OTA') {
    await sendCommand('OTA:' + pass);
    showToast('✔ OTA mode');
    setTimeout(() => alert('OTA Mode\n\n1. WiFi → ESP32_OTA\n2. Password: sameer@256\n3. Chrome → http://192.168.4.1'), 300);
  }
}

// ---- FIND Button (10 sec MLOCK repeat) ----
async function startFind() {
  state.pendingAction = 'FIND';
  el.findStatus.textContent = '🔍 SEARCHING — MLOCK repeat 10s...';
  el.findStatus.className = 'find-status blue';

  // First MLOCK immediately
  await sendCommand('MLOCK');

  // Repeat MLOCK every second for 10 seconds
  let count = 1;
  state.findRepeatTimer = setInterval(async () => {
    count++;
    if (count <= 10) {
      await sendCommand('MLOCK');
      console.log('[FIND] MLOCK #' + count);
    }
  }, CONFIG.FIND_MLOCK_INTERVAL_MS);

  // After 10 seconds: stop repeat, request STATUS
  state.findTimer = setTimeout(async () => {
    stopFindTimers();
    await sendCommand('STATUS');
    el.findStatus.textContent = '✅ Search complete';
    setTimeout(() => {
      state.pendingAction = null;
      if (el.findStatus.textContent === '✅ Search complete') {
        el.findStatus.textContent = 'Ready';
        el.findStatus.className = 'find-status';
      }
    }, 2000);
  }, CONFIG.FIND_DURATION_MS);
}

// ---- Button handlers ----
el.btnPair.addEventListener('click', pairFirstTime);

el.btnIgON.addEventListener('click', async () => {
  if (await sendCommand('IGON')) showToast('⚡ Ignition ON');
});
el.btnIgOFF.addEventListener('click', async () => {
  if (await sendCommand('IGOFF')) showToast('🔓 Ignition OFF');
});
el.btnMLock.addEventListener('click', async () => {
  if (await sendCommand('MLOCK')) showToast('🔒 Motor Lock');
});
el.btnBoot.addEventListener('click', async () => {
  if (await sendCommand('BOOT')) showToast('🚪 Boot opening');
});
el.btnFind.addEventListener('click', startFind);

el.btnDebug.addEventListener('click', () => showPasswordModal('DEBUG'));
el.btnOTA.addEventListener('click', () => showPasswordModal('OTA'));
el.btnLoc.addEventListener('click', showSavedLocation);

el.modalCancel.addEventListener('click', hidePasswordModal);
el.modalSubmit.addEventListener('click', submitPassword);
el.modalInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitPassword();
});

// ---- Init ----
(function init() {
  setConnectedUI(false);
  if (!navigator.bluetooth) {
    setBadge('NOT SUPPORTED', '');
    el.footerHint.textContent = 'Use Chrome on Android';
    el.btnPair.disabled = true;
    return;
  }
  // Try auto-connect on load
  setTimeout(autoConnect, 500);

  window.addEventListener('beforeunload', () => {
    if (state.isConnected) saveLastLocation();
  });

  // Also try reconnect when page becomes visible again
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !state.isConnected) {
      autoConnect();
    }
  });

  console.log('[SAME] Auto-connect app ready');
})();
</script>
</body>
